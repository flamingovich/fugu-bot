
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Dynamic Transformer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        #root:empty::before {
            content: 'Загрузка приложения...';
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #64748b;
            font-size: 1.125rem;
        }
        #error-display {
            display: none;
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #fee2e2;
            color: #991b1b;
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid #f87171;
            z-index: 9999;
            max-width: 90%;
            word-break: break-all;
            font-size: 12px;
        }
    </style>
    <script>
        // Предотвращаем ошибку 'process is not defined' в браузере
        window.process = { env: { NODE_ENV: 'production' } };
        
        // Перехват ошибок для отладки на Vercel
        window.onerror = function(msg, url, line, col, error) {
            const display = document.getElementById('error-display');
            if (display) {
                display.style.display = 'block';
                display.innerText = 'Ошибка: ' + msg + ' (Строка: ' + line + ')';
            }
            return false;
        };
    </script>
<script type="importmap">
{
  "imports": {

    "@google/genai": "https://esm.sh/@google/genai@1.40.0",
    "react-router-dom": "https://esm.sh/react-router-dom@7.1.5",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="error-display"></div>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
